<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ninaro: N-in-a-row, Connect 4 on any size board, against five rule-based computer players. A web port of a 1998 DOS game." />
    <title>Ninaro</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="app">
      <div class="toolbar">
        <a href="https://morfrog.github.io/" class="btn btn--link" id="home-link">Home</a>
        <button type="button" id="menu-button" class="btn">Menu</button>
        <button type="button" id="help-button" class="btn">Help</button>
        <span class="toolbar__title" id="board-title" hidden>
          <span class="toolbar__name">Ninaro</span>
          <span id="board-readout"></span>
        </span>
        <label class="toolbar__view">
          View
          <select id="view-mode" class="btn btn--select">
            <option value="normal">Normal</option>
            <option value="fullscreen">Fullscreen</option>
          </select>
        </label>
        <label class="toolbar__display">
          Display
          <select id="display-mode" class="btn btn--select">
            <option value="vga">VGA</option>
            <option value="mono">Monochrome</option>
            <option value="modern">Modern</option>
          </select>
        </label>
      </div>
      <div class="screen-frame" id="screen-frame">
        <canvas id="screen" class="screen" width="640" height="350" role="img" aria-label="Ninaro screen"></canvas>
      </div>
      <p class="note">
        Player one: A and D move, S or E drops, W or Q opens the menu. Player two: the arrow keys, Enter drops,
        Backspace opens the menu. Or click (tap) a column. Esc or M: menu. F1 or H: help.
      </p>
    </main>
    <footer class="site-footer">
      Web port of Ninaro v2.08, a 1998 DOS game.
      <a href="tournament.html">AI tournament</a> ·
      <a href="https://github.com/morfrog/ninaro">Source on GitHub</a>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
